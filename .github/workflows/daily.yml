name: daily-dashboard
on:
  schedule:
    - cron: "5 13 * * 1-5"    # 台北 21:05（融資統計約 21:00 公布後立即更新）
    - cron: "0 15 * * 1-5"    # 台北 23:00 備援（當天資料晚出時自動補跑）
  workflow_dispatch:           # 也可以手動觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests yfinance

      - name: Build dashboard
        run: python sepa_pages.py

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
